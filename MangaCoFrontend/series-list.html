<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series - MangaCo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">📚 MangaCo</a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="comic-list.html">Comics</a>
                <a href="series-list.html" class="active">Series</a>
                <a href="author-list.html">Autores</a>
                <a href="publisher.html">Editoriales</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">Series</h2>
                    <button type="button" class="btn btn-primary" id="btnNewSeries">➕ Nueva Serie</button>
                </div>
                <div id="seriesList" class="grid grid-4"></div>
            </div>
        </section>
    </main>

    <!-- Modal genérico de Serie -->
    <div id="modalSeries" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalSeriesTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalSeriesTitle">Nueva Serie</h2>
                <button type="button" class="modal-close" data-close-modal aria-label="Cerrar">&times;</button>
            </div>
            <form id="form-series">
                <div class="modal-body">
                    <input type="hidden" id="seriesId" name="id">
                    <div class="form-group">
                        <label for="title">Título *</label>
                        <input type="text" id="title" name="title" maxlength="250" required>
                    </div>
                    <div class="form-group">
                        <label for="originalTitle">Título original</label>
                        <input type="text" id="originalTitle" name="originalTitle" maxlength="250">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoryId">Categoría</label>
                            <select id="categoryId" name="categoryId">
                                <option value="">— Selecciona una categoría —</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="classificationId">Clasificación</label>
                            <select id="classificationId" name="classificationId">
                                <option value="">— Selecciona una clasificación —</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="totalVolumes">Total de tomos</label>
                            <input type="number" id="totalVolumes" name="totalVolumes" min="0" step="1">
                        </div>
                        <div class="form-group">
                            <label for="status">Estado</label>
                            <select id="status" name="status">
                                <option value="">— Selecciona un estado —</option>
                                <option value="ONGOING">En curso</option>
                                <option value="COMPLETED">Finalizada</option>
                                <option value="CANCELLED">Cancelada</option>
                                <option value="HIATUS">En pausa</option>
                                <option value="ONESHOT">Tomo único</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startDate">Fecha de inicio</label>
                            <input type="date" id="startDate" name="startDate">
                        </div>
                        <div class="form-group">
                            <label for="endDate">Fecha de fin</label>
                            <input type="date" id="endDate" name="endDate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="coverUrl">URL de la portada</label>
                        <input type="url" id="coverUrl" name="coverUrl" maxlength="500" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="synopsis">Sinopsis</label>
                        <textarea id="synopsis" name="synopsis" rows="4"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 MangaCo</p>
        </div>
    </footer>

    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
    </div>

    <script src="src/utils/domUtils.js"></script>
    <script src="src/utils/crudUtils.js"></script>
    <script src="src/services/authorService.js"></script>
    <script src="src/services/comicService.js"></script>
    <script src="src/services/seriesService.js"></script>
    <script src="src/services/publisherService.js"></script>
    <script src="src/services/metadataService.js"></script>
    <script src="src/controllers/seriesListController.js"></script>
</body>
</html>
